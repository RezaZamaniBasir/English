<html lang="fa" dir="rtl">
<head>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./styles.css" />
  <title>Daily English</title>

<body>
  <div id="app-shell">
    <header class="topbar">
      <div>

      <button id="install-btn" class="icon-btn hidden" type="button" aria-label="نصب اپ">＋</button>

    <div class="modal-body">
      <div class="modal-icon">🎓</div>
      <h2>این مرحله تمام شد</h2>
      <p>هر دو کتاب اصلی تمام شدند. کتاب‌های بعدی را برایم آپلود کن تا دوره را ادامه بدهیم.</p>
      <button id="finish-dialog-close" class="btn primary wide" type="button">متوجه شدم</button>

  <script src="./curriculum.js"></script>
  <script src="./app.js"></script>
